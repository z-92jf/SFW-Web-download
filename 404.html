<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>找不到这个文件 · SERVICES FOR Windows</title>
<meta name="robots" content="noindex">
<style>
	:root{
		--brand:#005a9e;
		--bg:#f7f9fc;
		--card:#ffffff;
		--text:#1a1d21;
		--muted:#5b6470;
		--faint:#8a939e;
		--border:#e3e8ef;
	}
	@media (prefers-color-scheme: dark){
		:root{
			--brand:#4aa3f0;
			--bg:#16181d;
			--card:#1e2127;
			--text:#e6e9ee;
			--muted:#a2abb8;
			--faint:#6f7986;
			--border:#2c313a;
		}
	}
	*{box-sizing:border-box}
	body{
		margin:0;min-height:100vh;
		display:flex;align-items:center;justify-content:center;
		padding:40px 20px;
		background:var(--bg);color:var(--text);
		font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
		line-height:1.65;
	}
	.box{
		max-width:480px;width:100%;text-align:center;
		background:var(--card);border:1px solid var(--border);
		border-radius:16px;padding:44px 32px;
	}
	.code{
		font-family:ui-monospace,Consolas,monospace;
		font-size:2.6rem;font-weight:600;color:var(--brand);
		line-height:1;margin-bottom:18px;
	}
	h1{margin:0 0 10px;font-size:1.15rem}
	p{margin:0 0 8px;color:var(--muted);font-size:0.92rem}
	p.small{font-size:0.84rem;color:var(--faint);margin-top:18px}
	.btn{
		display:inline-block;margin-top:26px;
		padding:11px 24px;border-radius:10px;
		background:var(--brand);color:#fff;text-decoration:none;
		font-size:0.92rem;
	}
	.btn:hover{filter:brightness(1.08)}
	code{
		background:rgba(127,127,127,.12);padding:1px 5px;border-radius:4px;
		font-size:0.88em;
	}
</style>
</head>
<body>
<div class="box">
	<div class="code">404</div>
	<h1>找不到这个文件</h1>
	<p>链接可能写错了，或者这个版本已经不在服务器上。</p>
	<p class="small">如果你是从别的地方复制来的地址，建议回下载页重新选一个。</p>
	<a class="btn" href="/">返回下载列表</a>
	<p class="small" style="margin-top:22px">
		© 2026 加法工作室 · <a href="https://sfw.us.ci" style="color:var(--brand);text-decoration:none">官网</a>
	</p>
</div>
</body>
</html>
