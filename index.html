<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SERVICES FOR Windows · 下载</title>
<meta name="description" content="SERVICES FOR Windows 安装包下载，Cloudflare 节点分发，国内访问更稳定。">
<link rel="icon" href="/favicon.ico">
<style>
	/* 配色跟官网保持一套：主色 #005a9e，深色模式换成亮一档的蓝 */
	:root{
		--brand:#005a9e;
		--brand-soft:#e8f0f8;
		--bg:#f7f9fc;
		--card:#ffffff;
		--text:#1a1d21;
		--muted:#5b6470;
		--faint:#8a939e;
		--border:#e3e8ef;
	}
	@media (prefers-color-scheme: dark){
		:root{
			--brand:#4aa3f0;
			--brand-soft:#1b2a38;
			--bg:#16181d;
			--card:#1e2127;
			--text:#e6e9ee;
			--muted:#a2abb8;
			--faint:#6f7986;
			--border:#2c313a;
		}
	}
	*{box-sizing:border-box}
	body{
		margin:0;padding:0;
		background:var(--bg);color:var(--text);
		font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
		line-height:1.65;
		-webkit-font-smoothing:antialiased;
	}
	.wrap{max-width:820px;margin:0 auto;padding:56px 20px 72px}

	/* ---------- 页头 ---------- */
	.brand{display:flex;align-items:center;gap:12px;margin-bottom:40px}
	.brand img{width:36px;height:36px;border-radius:9px}
	.brand .name{font-weight:600;font-size:1.02rem}
	.brand .tag{font-size:0.8rem;color:var(--faint);margin-left:auto}

	h1{margin:0 0 6px;font-size:1.75rem;letter-spacing:-0.01em}
	.sub{margin:0 0 36px;color:var(--muted);font-size:0.94rem}

	/* ---------- 最新版卡片 ---------- */
	.card{
		background:var(--card);border:1px solid var(--border);
		border-radius:16px;padding:26px 28px;
	}
	.latest{margin-bottom:44px;position:relative;overflow:hidden}
	.latest::before{
		content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
		background:var(--brand);
	}
	.head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}
	.head h2{margin:0;font-size:1.5rem;font-family:ui-monospace,Consolas,monospace}
	.badge{
		font-size:0.74rem;padding:2px 8px;border-radius:5px;
		background:var(--brand);color:#fff;letter-spacing:0.02em;
	}
	.stage{font-size:0.8rem;color:var(--muted)}
	.meta{margin:0 0 14px;font-size:0.86rem;color:var(--faint)}
	.note{margin:0 0 22px;font-size:0.92rem;color:var(--muted)}
	.files{display:flex;flex-wrap:wrap;gap:12px}
	.btn{
		display:inline-flex;align-items:center;gap:8px;
		padding:11px 20px;border-radius:10px;
		background:var(--brand);color:#fff;text-decoration:none;
		font-size:0.92rem;font-weight:500;
		transition:filter .15s;
	}
	.btn:hover{filter:brightness(1.08)}
	.btn .sz{opacity:.75;font-size:0.84rem;font-weight:400}
	.btn.alt{
		background:transparent;color:var(--brand);
		border:1px solid var(--border);
	}
	.btn.alt:hover{background:var(--brand-soft);filter:none}

	/* ---------- 历史版本 ---------- */
	h2.sec{margin:0 0 16px;font-size:1rem;color:var(--muted);font-weight:600}
	.rows{display:grid;gap:10px}
	.row{
		display:flex;align-items:center;gap:16px;flex-wrap:wrap;
		background:var(--card);border:1px solid var(--border);
		border-radius:12px;padding:14px 18px;
	}
	.row .v{font-family:ui-monospace,Consolas,monospace;font-size:0.98rem;min-width:74px}
	.row .d{font-size:0.84rem;color:var(--faint);min-width:96px}
	.row .acts{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
	.row .acts a{
		font-size:0.85rem;padding:6px 13px;border-radius:8px;
		border:1px solid var(--border);color:var(--brand);text-decoration:none;
	}
	.row .acts a:hover{background:var(--brand-soft)}

	/* ---------- 文件 MD5 ---------- */
	/* 一行放两个 32 位哈希会太长，所以让它独占一行、允许折行 */
	.md5line{
		flex-basis:100%;margin-top:6px;
		font-size:0.78rem;color:var(--faint);
		display:flex;flex-wrap:wrap;gap:6px 14px;
	}
	.md5line span{display:inline-flex;align-items:baseline;gap:5px}
	.md5line code{
		font-family:ui-monospace,Consolas,monospace;
		font-size:0.76rem;letter-spacing:0.01em;
		padding:1px 5px;border-radius:4px;
		background:var(--brand-soft);color:var(--muted);
		word-break:break-all;
		/* 双击能整段选中，方便复制去核对 */
		user-select:all;
	}

	/* ---------- 提示与页脚 ---------- */
	.tip{
		margin:32px 0 0;padding:14px 18px;
		background:var(--brand-soft);border-radius:10px;
		font-size:0.86rem;color:var(--muted);
	}
	.tip strong{color:var(--text)}
	.err{color:#c0392b;font-size:0.9rem}
	footer{
		margin-top:52px;padding-top:22px;border-top:1px solid var(--border);
		font-size:0.83rem;color:var(--faint);
	}
	footer a{color:var(--brand);text-decoration:none}
	footer a:hover{text-decoration:underline}

	@media (max-width:560px){
		.wrap{padding:36px 16px 56px}
		.card{padding:20px 18px}
		.row{gap:8px}
		.row .acts{width:100%;margin-left:0}
		.row .acts a{flex:1;text-align:center}
		/* 窄屏下两个下载按钮改成各占一整行：
		   并排的话「免安装包 6.60 MB」会被挤成两行，很难看 */
		.files{flex-direction:column}
		.btn{width:100%;justify-content:center}
		/* .md5line 用的是 flex-basis:100%（横向占满），
		   在 column 容器里 basis 变成「高度」，必须重置回 auto */
		.md5line{flex-basis:auto;width:100%}
	}
</style>
</head>
<body>
<div class="wrap">

	<div class="brand">
		<img src="/logo.png" alt="" width="36" height="36">
		<span class="name">SERVICES FOR Windows</span>
		<span class="tag">Cloudflare 节点分发</span>
	</div>

	<h1>下载</h1>
	<p class="sub">这里的安装包由 Cloudflare 全球节点分发，国内访问通常比 GitHub 更稳定。</p>

	<div id="app">
		<p class="note">正在读取版本列表…</p>
	</div>

	<p class="tip">
		<strong>提示</strong>：安装版是可执行安装程序，按向导完成安装；免安装包是压缩包，解压后直接运行。
		两者内容一致，按习惯选一个就行。
	</p>

	<footer>
		© 2026 加法工作室 All rights reserved. ·
		<a href="https://sfw.us.ci">返回官网</a> ·
		<a href="https://github.com/z-92jf/SERVICES-FOR-Windows/releases">GitHub Releases</a>
	</footer>
</div>

<script>
	// versions.json 就在同目录，发新版时只改那个文件，这里不用动
	const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

	fetch('versions.json', { cache: 'no-cache' })
		.then((r) => {
			if (!r.ok) throw new Error('HTTP ' + r.status);
			return r.json();
		})
		.then((data) => {
			const list = Array.isArray(data.versions) ? data.versions : [];
			if (!list.length) {
				document.getElementById('app').innerHTML = '<p class="note">还没有可下载的版本。</p>';
				return;
			}
			document.getElementById('app').innerHTML = renderLatest(list[0]) + renderHistory(list.slice(1));
		})
		.catch((err) => {
			document.getElementById('app').innerHTML =
				'<p class="err">读取版本列表失败（' + esc(err.message) + '）。</p>' +
				'<p class="note">如果这个页面是直接双击打开的文件，浏览器会拦住读取；请通过网址访问。</p>';
		});

	function fileLinks(files, big) {
		return (files || [])
			.map((f, i) => {
				const cls = big && i === 0 ? 'btn' : big ? 'btn alt' : '';
				const href = esc(f.file);
				if (!big) {
					return '<a href="' + href + '">' + esc(f.label) + '</a>';
				}
				return (
					'<a class="' + cls + '" href="' + href + '">' +
					esc(f.label) + '<span class="sz">' + esc(f.size || '') + '</span>' +
					'</a>'
				);
			})
			.join('');
	}

	// MD5 行：按扩展名区分「安装程序」和「免安装包」，和官网弹窗的措辞保持一致
	function md5Line(files) {
		const items = (files || []).filter((f) => f.md5);
		if (!items.length) return '';
		const cells = items
			.map((f) => {
				const isZip = /\.zip$/i.test(f.file);
				return (
					'<span>' + (isZip ? '免安装包' : '安装程序') +
					' <code>' + esc(f.md5) + '</code></span>'
				);
			})
			.join('');
		return '<div class="md5line">' + cells + '</div>';
	}

	function renderLatest(v) {
		return (
			'<section class="card latest">' +
			'<div class="head">' +
			'<span class="badge">最新版</span>' +
			'<h2>v' + esc(v.version) + '</h2>' +
			(v.stage ? '<span class="stage">' + esc(v.stage) + '</span>' : '') +
			'</div>' +
			'<p class="meta">发布于 ' + esc(v.date || '') + '</p>' +
			(v.note ? '<p class="note">' + esc(v.note) + '</p>' : '') +
			'<div class="files">' + fileLinks(v.files, true) + md5Line(v.files) + '</div>' +
			'</section>'
		);
	}

	function renderHistory(list) {
		if (!list.length) return '';
		const rows = list
			.map(
				(v) =>
					'<div class="row">' +
					'<div class="v">v' + esc(v.version) + '</div>' +
					'<div class="d">' + esc(v.date || '') + '</div>' +
					'<div class="acts">' + fileLinks(v.files, false) + '</div>' +
					md5Line(v.files) +
					'</div>'
			)
			.join('');
		return '<h2 class="sec">历史版本</h2><div class="rows">' + rows + '</div>';
	}
</script>
</body>
</html>
